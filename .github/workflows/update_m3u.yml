name: Film M3U Botu

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          # Buraya scraper kütüphanelerini ekledik
          pip install requests beautifulsoup4 cloudscraper brotli

      - name: Botu Çalıştır (M3U Oluştur)
        run: python bot.py

      - name: Değişiklikleri GitHub'a Yükle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add filmler.m3u
          git diff --staged --quiet || (git commit -m "M3U listesi başarıyla güncellendi 🎬" && git push)
