name: Film M3U Botu

on:
  schedule:
    - cron: '0 */12 * * *' # Her 12 saatte bir çalıştırır
  workflow_dispatch: # GitHub sitesinden manuel olarak da tetikleyebilmeni sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Botu Çalıştır (M3U Oluştur)
        run: python bot.py

      - name: Değişiklikleri GitHub'a Yükle (Commit)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add filmler.m3u
          # Değişiklik yoksa hata vermesini engelle
          git commit -m "M3U listesi güncellendi" || exit 0
          git push
